<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دوو برا</title>
<link rel="preconnect" href="https://foplvmfppbngywmxmqof.supabase.co" crossorigin>
<style>
:root{--bg:#f3f5f7;--card:#fff;--line:#dde3e8;--warn:#b4432f;--warnsoft:#fbe9e5}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#17222a;--line:#26343e;--warn:#ef8a74;--warnsoft:#3a201b}}
body{margin:0;background:var(--bg);font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:24px 16px}
.sk{height:18px;border-radius:6px;background:var(--line);margin:14px 0;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.4}}
.err{background:var(--warnsoft);color:var(--warn);font-weight:700;padding:16px;border-radius:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<script>
const API='https://foplvmfppbngywmxmqof.supabase.co/rest/v1/rpc/scan';
const KEY='sb_publishable_HFxscwwTWxXEspJEnpJgFA_Ib4A5cAQ';
const DEFAULT_TPL="<!doctype html>\n<html lang=\"ckb\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>\u062f\u0648\u0648 \u0628\u0631\u0627<\/title>\n<style>\n:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--muted:#5d6b76;--line:#dde3e8;--accent:#0e7c66;--soft:#e1f2ed}\n@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#17222a;--ink:#e7edf1;--muted:#93a3ae;--line:#26343e;--accent:#3cc4a3;--soft:#163a33}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Vazirmatn\",\"Noto Sans Arabic\",Tahoma,sans-serif;font-size:16px;line-height:1.6}\n.wrap{max-width:460px;margin:0 auto;padding:24px 16px}\n.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}\n.logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}\n.top b{font-size:20px;display:block;line-height:1.2}.top small{color:var(--muted)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}\n.f{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}\n.f:last-child{border:0}.f span{color:var(--muted)}.f b{text-align:end;word-break:break-word}\n.pill{display:inline-block;font-size:13px;padding:2px 12px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700;margin-bottom:8px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\"><div class=\"logo\">DB<\/div><div><b>\u062f\u0648\u0648 \u0628\u0631\u0627<\/b><small>Dw Bra<\/small><\/div><\/div>\n  <div class=\"card\">\n    <span class=\"pill\">{{status}}<\/span>\n    {{rows}}\n    <div class=\"f\"><span>\u06a9\u0627\u062a\u06cc \u06cc\u06d5\u06a9\u06d5\u0645 \u0633\u06a9\u0627\u0646<\/span><b dir=\"ltr\">{{time}}<\/b><\/div>\n  <\/div>\n<\/div>\n<\/body>\n<\/html>\n";

/* fills {{...}} placeholders; values are escaped, {{rows}} is built here */
function fillTpl(tpl,d){
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const h=d.headers||[], v=d.data||[];
  const rows=v.map((x,i)=>(x!==null&&String(x).trim()!=='')?'<div class="f"><span>'+esc(h[i]||('زانیاری '+(i+1)))+'</span><b>'+esc(x)+'</b></div>':'').join('');
  const map={rows, status:d.first?'یەکەم جار سکان کرا':'پێشتر سکان کراوە', time:d.scanned_at, count:d.count, code:d.code};
  for(let i=0;i<5;i++){ map[String(i+1)]=v[i]; map['name'+(i+1)]=h[i]; }
  return tpl.replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>k==='rows'?rows:(k in map?esc(map[k]):m));
}
const code=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
const fail=t=>{document.getElementById('out').innerHTML='<div class="err">'+t+'</div>'};
if(!code) fail('QR کۆدەکە دروست نییە.');
else fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_code:code})})
.then(r=>r.json()).then(d=>{
  if(!d.ok){fail(d.error==='empty'?'ببورە، لە ئێستادا هیچ زانیارییەک بەردەست نییە.':'ئەم QR کۆدە دروست نییە.');return}
  d.code=code;
  const html=fillTpl((d.tpl&&d.tpl.trim())?d.tpl:DEFAULT_TPL,d);
  document.open(); document.write(html); document.close();
}).catch(()=>fail('کێشەی ئینتەرنێت هەیە، تکایە دووبارە هەوڵ بدەرەوە.'));
</script>
</body>
</html>
