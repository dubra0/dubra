<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوو برا</title>
<link rel="preconnect" href="https://foplvmfppbngywmxmqof.supabase.co" crossorigin>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--muted:#5d6b76;--line:#dde3e8;--accent:#0e7c66;--soft:#e1f2ed;--warn:#b4432f;--warnsoft:#fbe9e5}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#17222a;--ink:#e7edf1;--muted:#93a3ae;--line:#26343e;--accent:#3cc4a3;--soft:#163a33;--warn:#ef8a74;--warnsoft:#3a201b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:460px;margin:0 auto;padding:24px 16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--card);display:grid;place-items:center;font-weight:900;font-size:20px}
.top b{font-size:20px;display:block;line-height:1.2}.top small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.f{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.f:last-child{border:0}.f span{color:var(--muted)}.f b{text-align:end;word-break:break-word}
.pill{display:inline-block;font-size:13px;padding:2px 12px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700;margin-bottom:8px}
.err{background:var(--warnsoft);color:var(--warn);font-weight:700;padding:16px;border-radius:14px;text-align:center}
.sk{height:18px;border-radius:6px;background:var(--line);margin:14px 0;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.4}}
.ms{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);direction:ltr}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">DB</div><div><b>دوو برا</b><small>Dw Bra</small></div></div>
  <div id="out" class="card"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="ms" id="ms"></div>
</div>
<script>
const API='https://foplvmfppbngywmxmqof.supabase.co/rest/v1/rpc/scan';
const KEY='sb_publishable_HFxscwwTWxXEspJEnpJgFA_Ib4A5cAQ';
const out=document.getElementById('out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const code=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
const t0=performance.now();
if(!code){out.outerHTML='<div class="err">QR کۆدەکە دروست نییە.</div>'}
else fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({p_code:code})})
.then(r=>r.json()).then(d=>{
  document.getElementById('ms').textContent=Math.round(performance.now()-t0)+' ms';
  if(!d.ok){out.outerHTML='<div class="err">'+(d.error==='empty'?'ببورە، لە ئێستادا هیچ زانیارییەک بەردەست نییە.':'ئەم QR کۆدە دروست نییە.')+'</div>';return}
  const h=d.headers||[];let html='<span class="pill">'+(d.first?'یەکەم جار سکان کرا':'پێشتر سکان کراوە')+'</span>';
  d.data.forEach((v,i)=>{if(v!==null&&String(v).trim()!=='')html+='<div class="f"><span>'+esc(h[i]||('زانیاری '+(i+1)))+'</span><b>'+esc(v)+'</b></div>'});
  html+='<div class="f"><span>کاتی یەکەم سکان</span><b dir="ltr">'+esc(d.scanned_at)+'</b></div>';
  out.innerHTML=html;
}).catch(()=>{out.outerHTML='<div class="err">کێشەی ئینتەرنێت هەیە، تکایە دووبارە هەوڵ بدەرەوە.</div>'});
</script>
</body>
</html>
